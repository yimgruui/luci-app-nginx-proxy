name: Build and Release luci-app-nginx-proxy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建成功后是否创建/更新 GitHub Release'
        required: true
        type: boolean
        default: false
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.format }} (OpenWrt ${{ matrix.version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
            version: '24.10.8'
            package_suffix: '_*.ipk'
            package_extension: 'ipk'
          - format: apk
            version: '25.12.6'
            package_suffix: '-*.apk'
            package_extension: 'apk'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(sed -n 's/^PKG_NAME:=//p' Makefile | head -n 1 | tr -d '\r')"
          PACKAGE_VERSION="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n 1 | tr -d '\r')"
          PACKAGE_RELEASE="$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n 1 | tr -d '\r')"
          test -n "$PACKAGE_NAME" && test -n "$PACKAGE_VERSION" && test -n "$PACKAGE_RELEASE"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$PACKAGE_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Package: $PACKAGE_NAME $PACKAGE_VERSION-$PACKAGE_RELEASE"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_RELEASE: ${{ steps.package.outputs.release }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ "$TAG" != "v${PACKAGE_VERSION}" && "$TAG" != "v${PACKAGE_VERSION}-${PACKAGE_RELEASE}" ]]; then
            echo "Tag '$TAG' does not match Makefile version '${PACKAGE_VERSION}-${PACKAGE_RELEASE}'." >&2
            exit 1
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget curl zstd

      - name: Download and extract OpenWrt SDK
        shell: bash
        env:
          OPENWRT_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          SDK_INDEX="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/"
          curl --retry 3 --retry-delay 2 -fsSL "$SDK_INDEX" -o "$RUNNER_TEMP/sdk-index.html"
          SDK_FILE="$(grep -oE 'openwrt-sdk-[^"<> ]+Linux-x86_64\.tar\.zst' "$RUNNER_TEMP/sdk-index.html" | sort -u | head -n 1)"
          test -n "$SDK_FILE"
          curl --retry 3 --retry-delay 2 -fL "${SDK_INDEX}${SDK_FILE}" -o "$RUNNER_TEMP/openwrt-sdk.tar.zst"
          SDK_DIR="$RUNNER_TEMP/openwrt-sdk-${OPENWRT_VERSION}"
          mkdir -p "$SDK_DIR"
          tar --zstd -xf "$RUNNER_TEMP/openwrt-sdk.tar.zst" -C "$SDK_DIR" --strip-components=1
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Link source and prepare SDK
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/Makefile"
          mkdir -p "$SDK_DIR/package"
          ln -s "$GITHUB_WORKSPACE" "$SDK_DIR/package/$PACKAGE_NAME"
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Compile package
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          make "package/${PACKAGE_NAME}/compile" -j"$(nproc)"

      - name: Collect package and checksum
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_FORMAT: ${{ matrix.format }}
          PACKAGE_SUFFIX: ${{ matrix.package_suffix }}
          PACKAGE_EXTENSION: ${{ matrix.package_extension }}
          OPENWRT_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          BASE_NAME="${PACKAGE_NAME#luci-app-}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mapfile -t PACKAGE_FILES < <(
            find "$SDK_DIR/bin/packages" -type f \
              \( -name "${PACKAGE_NAME}*.${PACKAGE_EXTENSION}" -o -name "luci-i18n-${BASE_NAME}-*.${PACKAGE_EXTENSION}" \) \
              -print | sort
          )
          test "${#PACKAGE_FILES[@]}" -gt 0
          if ! printf '%s\n' "${PACKAGE_FILES[@]}" | grep -q '/luci-i18n-'; then
            echo "Missing luci-i18n package; check that po/zh_Hans exists and luci.mk built it." >&2
            printf '%s\n' "${PACKAGE_FILES[@]}" >&2
            exit 1
          fi
          printf '%s\n' "${PACKAGE_FILES[@]}"
          cp "${PACKAGE_FILES[@]}" "$GITHUB_WORKSPACE/dist/"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum ./*."$PACKAGE_EXTENSION" > "SHA256SUMS-${PACKAGE_FORMAT}-openwrt-${OPENWRT_VERSION}.txt"
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.format }}-openwrt-${{ matrix.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    if: >-
      ${{
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release)
      }}
    steps:
      - name: Checkout source for release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            PACKAGE_VERSION="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n 1 | tr -d '\r')"
            PACKAGE_RELEASE="$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n 1 | tr -d '\r')"
            if [[ -z "$PACKAGE_VERSION" || -z "$PACKAGE_RELEASE" ]]; then
              echo "Unable to determine PKG_VERSION / PKG_RELEASE from Makefile." >&2
              exit 1
            fi
            TAG="v${PACKAGE_VERSION}-${PACKAGE_RELEASE}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined SHA256 file
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          PACKAGE_FILES=( *.ipk *.apk )
          test "${#PACKAGE_FILES[@]}" -gt 0
          sha256sum "${PACKAGE_FILES[@]}" > SHA256SUMS.txt
          ls -lh

      - name: Generate release notes
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -n "$PREV" && "$PREV" != "$TAG" ]]; then
            CHANGES="$(git log --no-merges --pretty='- %s' "$PREV..$GITHUB_SHA" | head -n 40)"
            COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/$PREV...$TAG"
          else
            CHANGES="$(git log --no-merges --pretty='- %s' -n 20 "$GITHUB_SHA")"
            COMPARE=""
          fi
          [[ -n "$CHANGES" ]] || CHANGES="- 维护性更新"
          {
            printf '## luci-app-nginx-proxy %s\n\n' "$TAG"
            printf '%s\n\n' "在现有 nginx 上做「域名 → 内网 host:port」的最小反向代理管理页：只写 /etc/nginx/conf.d/proxy.d/，保存时先 nginx -t 再 reload，失败自动回滚，不碰 LuCI 主站配置。"
                        printf '### 兼容性\n\n| 包 | 构建环境 |\n|---|---|\n| ipk | OpenWrt 24.10.8（23.05+ 通用） |\n| apk | OpenWrt 25.12.6 |\n\n'

            printf '### 安装\n\n'
            printf '```sh\n'
            printf '# OpenWrt 23.05 及以上（opkg，实测 24.10.8 SDK）\n'
            printf 'opkg install luci-app-nginx-proxy_*.ipk luci-i18n-nginx-proxy-zh-cn_*.ipk\n\n'
            printf '# OpenWrt 25.12（apk）\n'
            printf 'apk add --allow-untrusted luci-app-nginx-proxy-*.apk luci-i18n-nginx-proxy-zh-cn-*.apk\n'
            printf '```\n\n'
            printf '依赖：`%s`。简体中文在单独的 `luci-i18n-nginx-proxy-zh-cn` 包里，装好后跟随 LuCI 语言自动切换。\n\n' "luci-compat nginx-ssl openssl-util"
            printf '### 本次变更\n\n%s\n\n' "$CHANGES"
            if [[ -n "$COMPARE" ]]; then printf '完整对比：%s\n\n' "$COMPARE"; fi
            printf '### 校验\n\n'
            printf '下载 `SHA256SUMS.txt` 后执行 `sha256sum -c SHA256SUMS.txt`。\n'
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: luci-app-nginx-proxy ${{ steps.release_tag.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
