
    
  
name: Build and Release luci-app-nginx-proxy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.format }} (OpenWrt ${{ matrix.version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
            version: '24.10.8'
            package_suffix: '_*.ipk'
            package_extension: 'ipk'
          - format: apk
            version: '25.12.6'
            package_suffix: '-*.apk'
            package_extension: 'apk'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read package name
        id: package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(sed -n 's/^PKG_NAME:=//p' Makefile | head -n 1 | tr -d '\r')"
          test -n "$PACKAGE_NAME"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget curl zstd

      - name: Download and extract OpenWrt SDK
        shell: bash
        env:
          OPENWRT_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          SDK_INDEX="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/"
          curl --retry 3 --retry-delay 2 -fsSL "$SDK_INDEX" -o "$RUNNER_TEMP/sdk-index.html"
          SDK_FILE="$(grep -oE 'openwrt-sdk-[^"<> ]+Linux-x86_64\.tar\.zst' "$RUNNER_TEMP/sdk-index.html" | sort -u | head -n 1)"
          test -n "$SDK_FILE"
          curl --retry 3 --retry-delay 2 -fL "${SDK_INDEX}${SDK_FILE}" -o "$RUNNER_TEMP/openwrt-sdk.tar.zst"
          SDK_DIR="$RUNNER_TEMP/openwrt-sdk-${OPENWRT_VERSION}"
          mkdir -p "$SDK_DIR"
          tar --zstd -xf "$RUNNER_TEMP/openwrt-sdk.tar.zst" -C "$SDK_DIR" --strip-components=1
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Link source and prepare SDK
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/Makefile"
          mkdir -p "$SDK_DIR/package"
          ln -s "$GITHUB_WORKSPACE" "$SDK_DIR/package/$PACKAGE_NAME"
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Compile package
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          make "package/${PACKAGE_NAME}/compile" V=s -j"$(nproc)"

      - name: Collect package and checksum
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_FORMAT: ${{ matrix.format }}

