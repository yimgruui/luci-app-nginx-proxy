name: Build and Release OpenWrt Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.format }} (OpenWrt ${{ matrix.openwrt }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenWrt 24.10 uses opkg and produces .ipk packages.
          - format: ipk
            openwrt: "24.10.8"
          # OpenWrt 25.12 uses apk and produces .apk packages.
          - format: apk
            openwrt: "25.12.6"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          PKG_NAME="$(sed -n 's/^PKG_NAME:=//p' Makefile | head -n1 | tr -d '\r')"
          PKG_VERSION="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n1 | tr -d '\r')"
          PKG_RELEASE="$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n1 | tr -d '\r')"

          if [[ -z "$PKG_NAME" || -z "$PKG_VERSION" || -z "$PKG_RELEASE" ]]; then
            echo "Could not read PKG_NAME, PKG_VERSION or PKG_RELEASE from Makefile." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" != "v${PKG_VERSION}" && "$TAG" != "v${PKG_VERSION}-${PKG_RELEASE}" ]]; then
              echo "Tag '$TAG' does not match Makefile version '${PKG_VERSION}-${PKG_RELEASE}'." >&2
              exit 1
            fi
          else
            TAG="v${PKG_VERSION}-${PKG_RELEASE}"
          fi

          echo "package=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$PKG_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Package: $PKG_NAME"
          echo "Version: $PKG_VERSION"
          echo "Release: $PKG_RELEASE"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev \
            file wget curl zstd

      - name: Download OpenWrt SDK
        shell: bash
        env:
          OPENWRT_VERSION: ${{ matrix.openwrt }}
        run: |
          set -euo pipefail

          SDK_INDEX="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/"
          curl --retry 3 --retry-delay 2 -fsSL "$SDK_INDEX" -o "$RUNNER_TEMP/sdk-index.html"

          SDK_FILE="$(
            grep -oE 'openwrt-sdk-[^"<> ]+Linux-x86_64\.tar\.zst' "$RUNNER_TEMP/sdk-index.html" \
              | sort -u \
              | head -n1
          )"

          if [[ -z "$SDK_FILE" ]]; then
            echo "Could not find the x86/64 SDK for OpenWrt ${OPENWRT_VERSION} at ${SDK_INDEX}" >&2

